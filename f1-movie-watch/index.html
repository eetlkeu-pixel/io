<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 한 편, 신념 세 갈래</title>
<meta name="description" content="『F1 더 무비』를 어떻게 볼지 고민하다가, 사람마다 신념에 따라 다르게 행동하겠다는 생각이 든 한 참가자의 8컷 만화">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ef;--ink:#3a3330;--mute:#857a73;--paper:#fffdf8;--line:#3a3330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a19;--ink:#f1e9e1;--mute:#b5aaa1;--paper:#fffdf8;--line:#3a3330}}
:root[data-theme="dark"]{--bg:#1d1a19;--ink:#f1e9e1;--mute:#b5aaa1;--paper:#fffdf8;--line:#3a3330}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.5 "Gaegu","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:clamp(28px,5vw,56px) 16px}
h1{font-size:clamp(34px,6vw,52px);font-weight:700;margin:0;line-height:1.15;text-align:center}
.sub{color:var(--mute);text-align:center;margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
figure{margin:0;background:var(--paper);border:3px solid var(--line);border-radius:14px;overflow:hidden}
figure svg{display:block;width:100%;height:auto}
.end{text-align:center;margin:28px 0 0;font-size:22px}
.end small{display:block;color:var(--mute);font-size:16px;margin-top:6px}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
svg text{font-family:"Gaegu",sans-serif;fill:#3a3330}
</style>
</head>
<body>
<main class="wrap">
  <h1>영화 한 편, 신념 세 갈래</h1>
  <p class="sub">트레바리 첫 모임 전에 한 참가자가 해 본 생각</p>
  <div class="grid" id="comic"></div>
  <p class="end">여러분은 어디에 서 있나요?<small>등장하는 떡이·두부·호떡·고추는 이 만화를 위해 만든 캐릭터입니다.</small></p>
</main>
<script>
const L="#3a3330";
const sw=`stroke="${L}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
// 얼굴: mood = calm | worry | happy | wink | fierce | think
function face(x,y,m,s=1){
  const e=10*s,b=`<ellipse cx="${x-16*s}" cy="${y+8*s}" rx="${7*s}" ry="${4*s}" fill="#f7a8b8" opacity=".8"/><ellipse cx="${x+16*s}" cy="${y+8*s}" rx="${7*s}" ry="${4*s}" fill="#f7a8b8" opacity=".8"/>`;
  let eyes,mouth;
  const dot=(cx)=>`<ellipse cx="${cx}" cy="${y}" rx="${3*s}" ry="${4*s}" fill="${L}"/>`;
  const arc=(cx)=>`<path d="M${cx-4*s} ${y+1*s} Q${cx} ${y-5*s} ${cx+4*s} ${y+1*s}" fill="none" ${sw}/>`;
  if(m==="happy"){eyes=arc(x-e)+arc(x+e);mouth=`<path d="M${x-5*s} ${y+8*s} Q${x} ${y+14*s} ${x+5*s} ${y+8*s}" fill="none" ${sw}/>`}
  else if(m==="wink"){eyes=arc(x-e)+dot(x+e);mouth=`<path d="M${x-5*s} ${y+8*s} Q${x} ${y+13*s} ${x+5*s} ${y+8*s}" fill="none" ${sw}/>`}
  else if(m==="worry"){eyes=dot(x-e)+dot(x+e)+`<path d="M${x-e-5*s} ${y-6*s} L${x-e+4*s} ${y-9*s} M${x+e+5*s} ${y-6*s} L${x+e-4*s} ${y-9*s}" ${sw}/>`;mouth=`<path d="M${x-5*s} ${y+11*s} Q${x} ${y+7*s} ${x+5*s} ${y+11*s}" fill="none" ${sw}/>`}
  else if(m==="fierce"){eyes=dot(x-e)+dot(x+e)+`<path d="M${x-e-5*s} ${y-9*s} L${x-e+4*s} ${y-6*s} M${x+e+5*s} ${y-9*s} L${x+e-4*s} ${y-6*s}" ${sw}/>`;mouth=`<path d="M${x-5*s} ${y+9*s} L${x+5*s} ${y+9*s}" ${sw}/>`}
  else if(m==="think"){eyes=dot(x-e)+dot(x+e);mouth=`<circle cx="${x+3*s}" cy="${y+10*s}" r="${2.5*s}" fill="${L}"/>`}
  else {eyes=dot(x-e)+dot(x+e);mouth=`<path d="M${x-4*s} ${y+9*s} Q${x} ${y+12*s} ${x+4*s} ${y+9*s}" fill="none" ${sw}/>`}
  return b+eyes+mouth;
}
// 떡이: 하얀 찹쌀떡
const ddeok=(x,y,m="calm",s=1)=>`<g><path d="M${x-44*s} ${y+22*s} Q${x-48*s} ${y-30*s} ${x} ${y-34*s} Q${x+48*s} ${y-30*s} ${x+44*s} ${y+22*s} Q${x} ${y+34*s} ${x-44*s} ${y+22*s}Z" fill="#fff" ${sw}/><path d="M${x-30*s} ${y-22*s} q6 -4 12 -2" fill="none" stroke="#e8e0d8" stroke-width="3" stroke-linecap="round"/>${face(x,y-2*s,m,s)}</g>`;
// 두부: 반듯한 네모
const tofu=(x,y,m="calm",s=1)=>`<g><rect x="${x-36*s}" y="${y-34*s}" width="${72*s}" height="${66*s}" rx="${12*s}" fill="#fbf3dd" ${sw}/><path d="M${x-26*s} ${y-24*s} h${14*s}" stroke="#efe2bd" stroke-width="3" stroke-linecap="round"/>${face(x,y-2*s,m,s)}</g>`;
// 호떡: 납작한 동그라미
const hotteok=(x,y,m="calm",s=1)=>`<g><ellipse cx="${x}" cy="${y}" rx="${50*s}" ry="${30*s}" fill="#e3ad67" ${sw}/><circle cx="${x-32*s}" cy="${y-12*s}" r="${3*s}" fill="#b97a35"/><circle cx="${x+34*s}" cy="${y-8*s}" r="${3*s}" fill="#b97a35"/><circle cx="${x+26*s}" cy="${y+16*s}" r="${2.5*s}" fill="#b97a35"/>${face(x,y-2*s,m,s)}</g>`;
// 고추: 빨간 고추
const gochu=(x,y,m="calm",s=1)=>`<g><path d="M${x-30*s} ${y-26*s} Q${x} ${y-40*s} ${x+30*s} ${y-26*s} Q${x+34*s} ${y+10*s} ${x+6*s} ${y+44*s} Q${x-2*s} ${y+50*s} ${x-8*s} ${y+40*s} Q${x-36*s} ${y+6*s} ${x-30*s} ${y-26*s}Z" fill="#f05a4a" ${sw}/><path d="M${x-6*s} ${y-36*s} Q${x} ${y-50*s} ${x+12*s} ${y-52*s}" fill="none" stroke="${L}" stroke-width="${9*s}" stroke-linecap="round"/><path d="M${x-6*s} ${y-36*s} Q${x} ${y-50*s} ${x+12*s} ${y-52*s}" fill="none" stroke="#6cbf5a" stroke-width="${4*s}" stroke-linecap="round"/>${face(x,y-6*s,m,s)}</g>`;
const sweat=(x,y)=>`<path d="M${x} ${y} q-6 10 0 13 q6 -3 0 -13Z" fill="#9fd3f2" ${sw.replace('3"','2"')}/>`;
const spark=(x,y)=>`<path d="M${x} ${y-9} L${x+2} ${y-2} L${x+9} ${y} L${x+2} ${y+2} L${x} ${y+9} L${x-2} ${y+2} L${x-9} ${y} L${x-2} ${y-2}Z" fill="#ffd45c" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>`;
// 말풍선: tail = [tx,ty]
function bubble(x,y,w,h,lines,tail,size=21){
  const t=tail?`<path d="M${tail[2]} ${y+h-2} L${tail[0]} ${tail[1]} L${tail[2]+18} ${y+h-2}" fill="#fff" ${sw}/><path d="M${tail[2]+3} ${y+h-3} L${tail[2]+15} ${y+h-3}" stroke="#fff" stroke-width="5"/>`:"";
  const tx=lines.map((l,i)=>`<text x="${x+w/2}" y="${y+h/2+(i-(lines.length-1)/2)*(size+3)+size/3}" font-size="${size}" text-anchor="middle" font-weight="700">${l}</text>`).join("");
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="#fff" ${sw}/>${t}${tx}`;
}
function cloud(x,y,w,h){return `<g fill="#fff" ${sw}><ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}"/></g><circle cx="${x+w*0.3}" cy="${y+h+12}" r="7" fill="#fff" ${sw}/><circle cx="${x+w*0.24}" cy="${y+h+30}" r="4" fill="#fff" ${sw}/>`}
const cap=(t,bg="#3a3330")=>`<rect x="0" y="262" width="400" height="38" fill="${bg}"/><text x="200" y="288" font-size="20" text-anchor="middle" font-weight="700" style="fill:#fff">${t}</text>`;
const num=n=>`<circle cx="22" cy="22" r="14" fill="#3a3330"/><text x="22" y="29" font-size="18" text-anchor="middle" font-weight="700" style="fill:#fff">${n}</text>`;
const floor=c=>`<rect width="400" height="300" fill="${c}"/><path d="M0 238 Q200 230 400 238" fill="none" stroke="#3a3330" stroke-width="2" opacity=".25"/>`;

const P=[
// 1
`${floor("#fff6e8")}
<rect x="228" y="56" width="150" height="104" rx="10" fill="#4a4a55" ${sw}/><rect x="238" y="66" width="130" height="84" rx="6" fill="#2b2b33"/>
<path d="M290 92 L303 115 L277 115Z" fill="#ffd45c"/><text x="290" y="113" font-size="16" text-anchor="middle" font-weight="700">!</text>
<text x="303" y="138" font-size="15" text-anchor="middle" style="fill:#fff">재생할 수 없습니다</text>
<path d="M286 160 L280 182 M320 160 L326 182" ${sw}/><path d="M266 182 H340" ${sw}/>
${ddeok(120,200,"worry")}${sweat(168,150)}
${bubble(30,40,170,62,["어…? 안 나와…"],[110,150,96])}
${cap("모임은 당장 다음 주인데")}${num(1)}`,
// 2
`${floor("#eef6ff")}
<rect x="150" y="30" width="130" height="220" rx="18" fill="#fff" ${sw}/><rect x="160" y="50" width="110" height="180" rx="6" fill="#b9cfe0"/>
<rect x="166" y="62" width="96" height="44" rx="10" fill="#fff"/><text x="214" y="81" font-size="14" text-anchor="middle">애플TV에서</text><text x="214" y="98" font-size="14" text-anchor="middle">재생이 안 돼요..</text>
<rect x="166" y="114" width="96" height="44" rx="10" fill="#fff"/><text x="214" y="133" font-size="14" text-anchor="middle">브라우저도</text><text x="214" y="150" font-size="14" text-anchor="middle">안 되더라구요</text>
<rect x="166" y="166" width="96" height="44" rx="10" fill="#fff"/><text x="214" y="185" font-size="14" text-anchor="middle">결국 개별</text><text x="214" y="202" font-size="14" text-anchor="middle">구매해야..</text>
${ddeok(80,214,"think",.8)}
${bubble(290,70,100,60,["다들","고생 중…"],[300,190,300])}
${cap("단톡방도 조용히 술렁술렁","#4f6d8a")}${num(2)}`,
// 3
`${floor("#f6f0ff")}
${cloud(150,26,230,130)}
${tofu(205,90,"calm",.55)}${hotteok(265,96,"wink",.55)}${gochu(325,90,"fierce",.55)}
${ddeok(110,206,"think")}
<text x="56" y="70" font-size="34" font-weight="700">?</text><text x="80" y="50" font-size="24" font-weight="700">?</text>
${cap("근데… 사람마다 여기서 다르게 하겠는데?","#7a62a8")}${num(3)}`,
// 4
`${floor("#eef8ec")}
${tofu(110,196,"calm")}
<path d="M146 196 L176 178" ${sw}/>
<rect x="176" y="128" width="70" height="116" rx="12" fill="#fff" ${sw}/><rect x="184" y="140" width="54" height="80" rx="4" fill="#e6f4e3"/>
<path d="M199 175 L208 186 L224 164" fill="none" stroke="#3d9a4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="211" y="210" font-size="14" text-anchor="middle" font-weight="700">결제 완료</text>
${spark(262,130)}${spark(282,160)}<text x="290" y="132" font-size="20" font-weight="700">띵-</text>
${bubble(34,36,180,62,["규칙은 지키는 거야."],[100,150,92])}
${cap("‘규정을 반드시 지킨다’ 두부","#3d8a4a")}${num(4)}`,
// 5
`${floor("#fff3e2")}
${hotteok(120,206,"wink")}
<rect x="214" y="110" width="160" height="44" rx="10" fill="#ffe6a8" ${sw}/><text x="294" y="139" font-size="20" text-anchor="middle" font-weight="700">무료 체험 7일</text>
<rect x="214" y="166" width="160" height="44" rx="10" fill="#ffd1d9" ${sw}/><text x="294" y="195" font-size="20" text-anchor="middle" font-weight="700">가족 공유 ON</text>
<path d="M172 196 L210 186" ${sw}/>
${bubble(30,40,190,62,["어긴 건 아니잖아~?"],[110,168,96])}
${cap("‘어기지는 않되 최대한 활용한다’ 호떡","#c27a26")}${num(5)}`,
// 6
`${floor("#fdeceb")}
${gochu(120,190,"fierce")}
<rect x="80" y="166" width="80" height="16" rx="8" fill="${L}"/><path d="M120 174 h0" ${sw}/>
<g transform="translate(280 150)"><ellipse cx="0" cy="0" rx="78" ry="54" fill="#5a5560" ${sw}/><text x="0" y="12" font-size="40" text-anchor="middle" font-weight="700" style="fill:#fff">???</text></g>
<path d="M300 214 L318 244 L282 244Z" fill="#ffd45c" ${sw}/><text x="300" y="241" font-size="20" text-anchor="middle" font-weight="700">!</text>
${bubble(20,30,220,74,["모임 전에 보기만 하면","이긴 거 아냐?"],[110,128,100],20)}
${cap("‘이길 수 있다면 적당히 어겨도 된다’ 고추","#c23a2c")}${num(6)}`,
// 7
`${floor("#f4f4f4")}
${tofu(70,200,"calm",.8)}${hotteok(200,206,"happy",.8)}${gochu(330,192,"fierce",.8)}
${bubble(10,62,118,56,["안전이 최고"],[70,160,58],19)}
${bubble(142,96,118,56,["아깝잖아"],[200,176,188],19)}
${bubble(272,40,118,56,["결과가 중요해"],[330,140,318],19)}
${cap("다들 나름의 이유가 있다","#5d5d6b")}${num(7)}`,
// 8
`${floor("#fff8d9")}
${ddeok(116,200,"happy")}
<rect x="196" y="120" width="170" height="112" rx="8" fill="#fff" ${sw}/><text x="281" y="148" font-size="18" text-anchor="middle" font-weight="700" style="fill:#e8730c">함께 나눌 질문</text>
<path d="M212 166 H350 M212 186 H340 M212 206 H330" stroke="#c9c0b7" stroke-width="4" stroke-linecap="round"/>
<path d="M160 196 L196 186" ${sw}/>${spark(370,110)}${spark(186,96)}
${bubble(24,30,240,74,["아, 이게 바로","이번 모임 질문이구나!"],[110,156,100],21)}
${cap("다음 주에 다른 멤버들한테도 물어봐야지","#e8730c")}${num(8)}`
];
const alt=["떡이가 TV 앞에서 재생할 수 없다는 화면을 보고 당황한다","단톡방에 애플TV와 브라우저에서 재생이 안 되고 개별 구매해야 한다는 이야기가 오간다","떡이가 사람마다 다르게 행동하겠다고 생각하며 두부, 호떡, 고추를 떠올린다","두부는 규칙은 지키는 거라며 바로 결제한다","호떡은 무료 체험과 가족 공유를 켜며 어긴 건 아니라고 한다","고추는 모임 전에 보기만 하면 이긴 거라며 수상한 방법 앞에 선다","세 친구가 안전이 최고, 아깝잖아, 결과가 중요해라고 각자 말한다","떡이가 함께 나눌 질문을 들고 이게 이번 모임 질문이라고 깨닫는다"];
document.getElementById("comic").innerHTML=P.map((s,i)=>`<figure><svg viewBox="0 0 400 300" role="img" aria-label="${i+1}컷: ${alt[i]}">${s}</svg></figure>`).join("");
</script>
</body>
</html>
