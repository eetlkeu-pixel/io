<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공개 페이지 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#15151e;--mute:#5d5d6b;--line:#dcdce3;--panel:#f4f4f7;--accent:#0a58ca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101016;--ink:#ececf2;--mute:#a3a3b2;--line:#2c2c38;--panel:#181822;--accent:#5b9bff}}
:root[data-theme="dark"]{--bg:#101016;--ink:#ececf2;--mute:#a3a3b2;--line:#2c2c38;--panel:#181822;--accent:#5b9bff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:clamp(32px,6vw,72px) 16px}
h1{font-size:clamp(28px,5vw,40px);font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:8px 0 32px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.item{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.item:hover{border-color:var(--accent);transform:translateY(-1px)}
a.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.t{font-size:18px;font-weight:700;margin:0}
.d{color:var(--mute);font-size:15px;margin:4px 0 0}
.m{color:var(--mute);font-size:13px;margin-top:8px}
.empty{color:var(--mute)}
</style>
</head>
<body>
<main class="wrap">
  <h1>공개 페이지 모음</h1>
  <p class="sub">직접 만든 페이지들을 모아 둔 곳입니다.</p>
  <ul id="list"><li class="empty">불러오는 중…</li></ul>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("pages.json",{cache:"no-store"}).then(r=>r.json()).then(pages=>{
  pages.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  document.getElementById("list").innerHTML=pages.length?pages.map(p=>`<li><a class="item" href="${esc(p.path)}"><p class="t">${esc(p.title)}</p>${p.description?`<p class="d">${esc(p.description)}</p>`:""}${p.date?`<div class="m">${esc(p.date)}</div>`:""}</a></li>`).join(""):`<li class="empty">아직 페이지가 없습니다.</li>`;
}).catch(()=>{document.getElementById("list").innerHTML=`<li class="empty">목록을 불러오지 못했습니다.</li>`});
</script>
</body>
</html>
